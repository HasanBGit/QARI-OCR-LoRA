[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qari-ocr-lora"
version = "0.1.0"
description = "LoRA fine-tuned Qari-OCR for Arabic handwritten text recognition"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Hassan Barmandah"},
    {name = "Fatimah Emad Eldin"},
    {name = "Khloud Al Jallad"},
    {name = "Omar Nacer"},
]
keywords = ["ocr", "arabic", "handwriting", "lora", "vlm", "qwen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.45.0",
    "accelerate>=0.26.0",
    "peft>=0.14.0",
    "bitsandbytes>=0.43.0",
    "qwen-vl-utils==0.0.8",
    "datasets>=2.16.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "tqdm",
    "jiwer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]

[project.urls]
Homepage = "https://github.com/HasanBGit/Qari-OCR-LoRA"
Repository = "https://github.com/HasanBGit/Qari-OCR-LoRA"
"Bug Tracker" = "https://github.com/HasanBGit/Qari-OCR-LoRA/issues"

[project.scripts]
qari-train = "scripts.train:main"
qari-infer = "scripts.inference:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100
