# Qari-OCR LoRA Training Configuration
# Usage: python scripts/train.py --config configs/training_config.yaml

model:
  model_id: "NAMAA-Space/Qari-OCR-v0.3-VL-2B-Instruct"
  model_tag: "qari_v0.3_lora"

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  use_dora: true
  use_rslora: true
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

training:
  num_epochs: 3
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0

sequence:
  max_seq_length: 2048
  max_image_size: 1024

logging:
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  save_total_limit: 5

paths:
  train_dataset_path: "./ARABIC_OCR_FINAL"
  output_dir: "./checkpoints/qari_lora"
  results_dir: "./results/qari_lora"
  logs_dir: "./logs/qari_lora"

seed: 42
